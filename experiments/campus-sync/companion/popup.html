<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse Campus Companion</title>
    <style>
      :root {
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #f5f7fa;
        background: #0a0d12;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 420px;
        margin: 0;
        background: #0a0d12;
      }

      button,
      summary {
        font: inherit;
      }

      .shell {
        min-height: 100%;
        padding: 18px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid #273244;
        border-radius: 9px;
        background: #111722;
        color: #6da8ff;
      }

      .brand-mark svg {
        width: 21px;
        height: 21px;
      }

      .brand-copy {
        min-width: 0;
      }

      .brand-copy h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.16em;
      }

      .brand-copy p {
        margin: 3px 0 0;
        color: #7d8798;
        font-size: 10px;
      }

      .campus-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #293345;
        border-radius: 999px;
        background: #111722;
        padding: 5px 8px;
        color: #aeb8c8;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .campus-chip::before {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: #67a5ff;
        content: "";
      }

      .status-card {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 18px;
        border: 1px solid #202936;
        border-radius: 11px;
        background: rgba(17, 23, 34, 0.78);
        padding: 11px 12px;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        border-radius: 999px;
        background: #697386;
      }

      .status-card[data-state="busy"] .status-dot {
        background: #67a5ff;
        animation: pulse 1.2s ease-in-out infinite;
      }

      .status-card[data-state="success"] .status-dot {
        background: #52c88a;
      }

      .status-card[data-state="error"] .status-dot {
        background: #e67878;
      }

      @keyframes pulse {
        50% {
          opacity: 0.42;
        }
      }

      #status {
        margin: 0;
        color: #c7cfdb;
        font-size: 11px;
        line-height: 1.45;
      }

      .section-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 19px;
        margin-bottom: 9px;
      }

      .section-heading p {
        margin: 0;
        color: #778194;
        font-size: 9px;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .recommended {
        color: #6f9fe6;
        font-size: 9px;
      }

      .sync-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .sync-action {
        display: flex;
        min-width: 0;
        min-height: 72px;
        align-items: center;
        gap: 10px;
        border: 1px solid #252e3d;
        border-radius: 12px;
        background: #10151e;
        padding: 12px;
        color: #e5e9f0;
        text-align: left;
        cursor: pointer;
        transition:
          border-color 120ms ease,
          background 120ms ease,
          transform 120ms ease;
      }

      .sync-action:hover:not(:disabled) {
        border-color: #39475d;
        background: #131a25;
        transform: translateY(-1px);
      }

      .sync-action:active:not(:disabled) {
        transform: translateY(0);
      }

      .sync-action.primary {
        border-color: #315f9e;
        background: #111a28;
      }

      .sync-action.primary:hover:not(:disabled) {
        border-color: #4e80c4;
        background: #142137;
      }

      .action-icon {
        display: grid;
        width: 34px;
        height: 34px;
        flex: 0 0 auto;
        place-items: center;
        border: 1px solid #2a3546;
        border-radius: 9px;
        background: #0c1119;
        color: #9ba7b8;
      }

      .primary .action-icon {
        border-color: #284f83;
        color: #75aaff;
      }

      .action-icon svg {
        width: 18px;
        height: 18px;
      }

      .action-copy {
        min-width: 0;
      }

      .action-title {
        display: block;
        overflow: hidden;
        font-size: 11px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .action-caption {
        display: block;
        margin-top: 3px;
        color: #727d8f;
        font-size: 9px;
        line-height: 1.35;
      }

      .open-pulse {
        display: flex;
        width: 100%;
        min-height: 39px;
        align-items: center;
        justify-content: center;
        gap: 7px;
        margin-top: 8px;
        border: 1px solid #293446;
        border-radius: 10px;
        background: #121821;
        color: #cfd6e1;
        font-size: 11px;
        font-weight: 650;
        cursor: pointer;
        transition:
          background 120ms ease,
          border-color 120ms ease,
          color 120ms ease;
      }

      .open-pulse:hover:not(:disabled) {
        border-color: #3c4a61;
        background: #161e29;
        color: #ffffff;
      }

      .open-pulse svg {
        width: 14px;
        height: 14px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.4;
      }

      #summary {
        margin-top: 14px;
        border: 1px solid #202936;
        border-radius: 12px;
        background: #0f141c;
        padding: 12px;
      }

      #summary[hidden] {
        display: none;
      }

      .summary-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      #summary-title {
        margin: 0;
        overflow: hidden;
        color: #dde3eb;
        font-size: 11px;
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #summary-subtitle {
        margin: 0;
        flex: 0 0 auto;
        color: #647086;
        font-size: 9px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 1px;
        margin-top: 10px;
        overflow: hidden;
        border: 1px solid #202936;
        border-radius: 9px;
        background: #202936;
      }

      .metric {
        min-width: 0;
        background: #0c1118;
        padding: 9px 4px 8px;
        text-align: center;
      }

      .metric strong {
        display: block;
        color: #f1f4f8;
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
      }

      .metric span {
        display: block;
        margin-top: 5px;
        overflow: hidden;
        color: #606b7e;
        font-size: 7px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .utilities {
        margin-top: 12px;
        border-top: 1px solid #1e2632;
        padding-top: 11px;
      }

      .inspect {
        width: 100%;
        border: 0;
        background: transparent;
        padding: 4px 0;
        color: #697488;
        text-align: left;
        font-size: 10px;
        cursor: pointer;
      }

      .inspect:hover:not(:disabled) {
        color: #9da8b8;
      }

      details {
        margin-top: 8px;
        border: 1px solid #1f2733;
        border-radius: 10px;
        background: #0d1219;
      }

      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 11px;
        color: #7f8a9c;
        font-size: 10px;
        cursor: pointer;
        list-style: none;
        user-select: none;
      }

      summary::-webkit-details-marker {
        display: none;
      }

      summary::after {
        color: #566173;
        content: "+";
        font-size: 13px;
      }

      details[open] summary::after {
        content: "−";
      }

      pre {
        max-height: 230px;
        overflow: auto;
        margin: 0 9px 9px;
        border-top: 1px solid #1c2430;
        padding: 9px 2px 2px;
        color: #7f8a9b;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font: 9px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 13px;
        color: #4e596a;
        font-size: 9px;
      }

      .footer strong {
        color: #677286;
        font-weight: 650;
      }
    </style>
  </head>

  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M3 12h4l2-6 4 12 2-6h6"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="brand-copy">
            <h1>PULSE</h1>
            <p>Campus Companion</p>
          </div>
        </div>
        <span class="campus-chip">UJCV</span>
      </header>

      <section id="status-card" class="status-card" data-state="idle" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <p id="status">Listo para sincronizar.</p>
      </section>

      <div class="section-heading">
        <p>Sincronización</p>
        <span class="recommended">Todas recomendado</span>
      </div>

      <div class="sync-grid">
        <button id="sync" class="sync-action" type="button">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v16H7.5A2.5 2.5 0 0 0 5 21.5v-16Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path d="M5 5.5v16" stroke="currentColor" stroke-width="1.6" />
            </svg>
          </span>
          <span class="action-copy">
            <span class="action-title">Materia actual</span>
            <span class="action-caption">Solo el curso abierto</span>
          </span>
        </button>

        <button id="sync-all" class="sync-action primary" type="button">
          <span class="action-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="m12 3 9 4.5-9 4.5-9-4.5L12 3Z"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
              />
              <path
                d="m5 11.5 7 3.5 7-3.5M5 15.5l7 3.5 7-3.5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span class="action-copy">
            <span class="action-title">Todas las materias</span>
            <span class="action-caption">Sincroniza el periodo</span>
          </span>
        </button>
      </div>

      <button id="open-pulse" class="open-pulse" type="button" disabled>
        Abrir en Pulse
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M5 12h14m-5-5 5 5-5 5"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>

      <section id="summary" hidden>
        <div class="summary-head">
          <p id="summary-title">Resumen</p>
          <p id="summary-subtitle"></p>
        </div>

        <div class="metrics">
          <div class="metric"><strong id="metric-courses">0</strong><span>Materias</span></div>
          <div class="metric"><strong id="metric-tasks">0</strong><span>Tareas</span></div>
          <div class="metric"><strong id="metric-docs">0</strong><span>Docs</span></div>
          <div class="metric"><strong id="metric-news">0</strong><span>Anuncios</span></div>
          <div class="metric"><strong id="metric-events">0</strong><span>Eventos</span></div>
        </div>
      </section>

      <div class="utilities">
        <button id="inspect" class="inspect" type="button">Inspeccionar página actual</button>

        <details>
          <summary>Detalles técnicos</summary>
          <pre id="output">Todavía no hay datos para mostrar.</pre>
        </details>
      </div>

      <footer class="footer">
        <span>Sesión del campus · sin contraseñas</span>
        <strong>Scale Studio</strong>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
